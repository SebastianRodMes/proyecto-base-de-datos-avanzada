# =====================================================================
# TurismoDW - entorno completo "levanta y listo"
#
#   docker compose up -d            # primera vez: construye y puebla todo
#   (esperar; el primer arranque genera 2M reservas y corre el ETL)
#
# Al terminar, TurismoDW queda disponible en localhost,1433 (sa / Armagedon45*).
# Los datos persisten en volumenes: un 'up' posterior levanta al instante y
# el orquestador detecta que ya esta poblada y no rehace nada.
#
# Servicios:
#   postgres      origen relacional; se autopobla con 2M reservas (initdb)
#   mongo         origen NoSQL; lo siembra el orquestador
#   sqlserver     destino: la base analitica TurismoDW
#   orchestrator  corre una vez: crea el esquema, siembra Mongo y ejecuta el ETL
# =====================================================================
name: turismodw

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: turismo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../01-postgres/origen/turismo_ddl.sql:/docker-entrypoint-initdb.d/01_ddl.sql:ro
      # El generador conserva y amplía los datos base de las semanas 1-2.
      # Sin este CRUD el volumen queda corto por 5 reservas, 5 clientes,
      # 4 hoteles y el resto de los registros semilla.
      - ../01-postgres/origen/turismo_crud.sql:/docker-entrypoint-initdb.d/02_crud.sql:ro
      - ../01-postgres/10-generador-volumen.sql:/docker-entrypoint-initdb.d/03_generador.sql:ro
    healthcheck:
      # -h 127.0.0.1 fuerza TCP: durante el initdb el servidor temporal solo
      # escucha el socket Unix, asi que esto solo da "healthy" cuando la base
      # ya termino de generar y acepta conexiones TCP de verdad.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d turismo"]
      interval: 10s
      timeout: 5s
      retries: 120
      start_period: 60s

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 30

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Armagedon45*"
      # Habilita grupos de disponibilidad para la prueba HA local. El limite
      # permite ejecutar la replica secundaria dentro de Docker Desktop.
      MSSQL_ENABLE_HADR: "1"
      MSSQL_MEMORY_LIMIT_MB: "4096"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ha_shared:/var/opt/mssql/ha
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Replica Always On para la prueba de reemplazo del nodo. Se inicia solo
  # con --profile ha para que el flujo ETL normal no consuma memoria extra.
  sqlserver-secondary:
    profiles: ["ha"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    hostname: sql-secondary
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Armagedon45*"
      MSSQL_ENABLE_HADR: "1"
      MSSQL_MEMORY_LIMIT_MB: "4096"
    ports:
      - "1434:1433"
    volumes:
      - mssql_secondary_data:/var/opt/mssql
      - ha_shared:/var/opt/mssql/ha
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Punto de conexion estable para Power BI. El script de failover recrea
  # solamente este proxy y cambia SQL_HA_BACKEND de principal a secundario.
  sql-ha-endpoint:
    profiles: ["ha"]
    image: alpine/socat:1.8.0.3
    command:
      - -d
      - -d
      - TCP-LISTEN:1433,fork,reuseaddr
      - TCP:${SQL_HA_BACKEND:-sqlserver}:1433
    ports:
      - "14330:1433"
    depends_on:
      sqlserver:
        condition: service_healthy
      sqlserver-secondary:
        condition: service_healthy

  orchestrator:
    build: ./orchestrator
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: turismo
      PG_USER: postgres
      PG_PASSWORD: postgres
      MONGO_URI: "mongodb://mongo:27017/"
      MONGO_DB: turismo_nosql
      SQL_SERVIDOR: sqlserver
      SQL_BASE: TurismoDW
      SQL_USUARIO: sa
      SQL_PASSWORD: "Armagedon45*"
      SQL_DRIVER: "ODBC Driver 17 for SQL Server"
      TURISMO_DIR_TRABAJO: /work/etl
    volumes:
      - ..:/proyecto:ro
      - ./sqlserver:/sql:ro
      - etl_work:/work
    restart: "no"

volumes:
  pg_data:
  mongo_data:
  mssql_data:
  mssql_secondary_data:
  ha_shared:
  etl_work:
